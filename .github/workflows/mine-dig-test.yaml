name: hello-test

on:
    push:
      branches:
        - main

    workflow_dispatch:
        inputs:
          name:
            type: string
            default: "buddy"
            
jobs:
    hello:
        runs-on: ubuntu-22.04
        steps:
            - name: "say-hello"
              run: echo "hi there, ${{ inputs.name }}"
              shell: sh

    bye:
        needs: hello
        runs-on: ubuntu-22.04
        steps:
            - name: "say-bye"
              run: print("See ya, $BYE_TO!")
              shell: python
              env:
                BYE_TO: ${{ inputs.name }}



        