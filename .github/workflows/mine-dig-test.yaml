name: hello-test

on:
    push:
      branches:
        - main

    workflow_dispatch:
        inputs:
          name:
            type: string
            default: "buddy"
            
jobs:
    hello:
        runs-on: ubuntu-22.04
        steps:
            - name: "say-hello"
              run: echo "hi there, ${{ inputs.name || 'joe' }}"
              shell: bash

    bye:
        needs: hello
        runs-on: ubuntu-22.04
        env:
          BYE_TO: ${{ inputs.name }}
        steps:
            - name: "say-bye"
              if: ${{ env.BYE_TO != 'sir johnson' }}
              run: |
                import os
                name = os.getenv('BYE_TO') or 'joe'
                print("See ya, " + name)
              shell: python
            - name: "farewell lord johnson"
              if: ${{ env.BYE_TO == 'sir johnson' }}
              run: echo "fare the well my lord!"
              shell: bash
    print-event:
        if:  ${{ github.event_name == 'workflow_dispatch' }}
        runs-on: ubuntu-22.04
        steps:
            - name: "display event playload"
              run: cat $GITHUB_EVENT_PATH
