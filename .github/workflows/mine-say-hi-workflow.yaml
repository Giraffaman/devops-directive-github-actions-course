name: hello-test

on:
    push:
      branches:
        - main

    workflow_dispatch:
      inputs:
        name:
          type: string
          default: "buddy"

    workflow_call:
      inputs:
        name:
          type: string
          default: "buddy"
        greeter_name:
          type: string
        is_called:
          type: boolean
          default: false
            
jobs:
    hello:
        runs-on: ubuntu-22.04
        steps:
            - name: "say-hello"
              run: echo "hi there, ${{ inputs.name || 'joe' }}"
              shell: bash
    bye:
        needs: hello
        runs-on: ubuntu-22.04
        env:
          BYE_TO: ${{ inputs.name }}
        steps:
            - name: "say-bye"
              if: ${{ env.BYE_TO != 'sir johnson' }}
              run: |
                import os
                name = os.getenv('BYE_TO') or 'joe'
                print("See ya, " + name)
              shell: python
            - name: "farewell lord johnson"
              if: ${{ env.BYE_TO == 'sir johnson' }}
              run: echo "fare the well my lord!"
              shell: bash
    print-event:
        if:  ${{ github.event_name == 'workflow_dispatch' && !inputs.is_called }}
        runs-on: ubuntu-22.04
        steps:
            - name: "display event playload"
              run: |
                echo $GITHUB_EVENT_NAME
                cat $GITHUB_EVENT_PATH
    sign-greeter:
      needs:
        [hello, bye]
        # not tested with other methods, but at least when calling workflow was triggered manually,
        # github.event_name will always be "workflow_dispatch" and never "workflow_call"
        # if: ${{ github.event_name == 'workflow_call' }}
        # therefore, we check a bool input instead which only is true if set by the calling workflow:
      if: ${{ inputs.is_called }}
      runs-on: ubuntu-22.04
      steps:
        - name: "sign as greeter"
          env:
            GREETER: ${{ inputs.greeter_name || 'xoxo' }}
          run: echo "Regards,\n$GREETER"